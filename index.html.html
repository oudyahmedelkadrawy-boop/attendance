<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تسجيل الحضور</title>
<style>
  :root{
    --bg:#15181c; --panel:#1f242a; --text:#f2f4f6; --muted:#9aa4ae;
    --ok:#1f8a4c; --dup:#d9822b; --bad:#c23b3b; --idle:#2b323a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #status{
    background:var(--idle); text-align:center;
    padding:22px 16px; min-height:96px;
    display:flex; flex-direction:column; justify-content:center; gap:4px;
    transition:background .15s;
  }
  #msg{font-size:26px;font-weight:700;line-height:1.3}
  #sub{font-size:15px;color:rgba(255,255,255,.75)}
  #reader{width:100%;max-width:520px;margin:12px auto 0;padding:0 12px}
  #reader video{border-radius:10px}
  #log{
    max-width:520px;width:100%;margin:12px auto 0;padding:0 16px 16px;
    overflow-y:auto;flex:1;
  }
  #log h2{font-size:15px;color:var(--muted);font-weight:600;margin:8px 0}
  #log ul{list-style:none;margin:0;padding:0}
  #log li{
    background:var(--panel);border-radius:8px;padding:10px 12px;margin-bottom:6px;
    display:flex;justify-content:space-between;gap:10px;font-size:16px;
  }
  #log li time{color:var(--muted);font-size:14px;white-space:nowrap}
  #log li.dup{border-right:4px solid var(--dup)}
  #log li.ok{border-right:4px solid var(--ok)}
  #log li.unknown{border-right:4px solid var(--bad)}
</style>
</head>
<body>
<div id="status"><div id="msg">وجّه الكاميرا على الـ QR</div><div id="sub">تسجيل اليوم: 0</div></div>
<div id="reader"></div>
<div id="log"><h2>آخر اللي اتسجلوا</h2><ul id="list"></ul></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzKIFsjso-PHFGKZDD5cyHMQOam483FPwIk-NuQeNbyCxRdCrCTtYHTQ-3WaqysoXGT/exec';

const statusEl = document.getElementById('status');
const msg = document.getElementById('msg');
const sub = document.getElementById('sub');
const list = document.getElementById('list');
const colors = {ok:'var(--ok)', dup:'var(--dup)', unknown:'var(--bad)', error:'var(--bad)'};

let busy = false;
let okCount = 0;
const recent = {};
let audioCtx = null;

function beep(kind){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = kind==='ok' ? 880 : kind==='dup' ? 520 : 260;
    g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (kind==='ok' ? 0.15 : 0.3));
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(kind==='ok' ? 100 : [120,60,120]);
}

function show(status, text){
  statusEl.style.background = colors[status] || 'var(--idle)';
  msg.textContent = text;
}

function addLog(status, text){
  const li = document.createElement('li');
  li.className = status;
  const t = new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  li.innerHTML = '<span></span><time>'+t+'</time>';
  li.firstChild.textContent = text;
  list.prepend(li);
  while(list.children.length > 12) list.removeChild(list.lastChild);
}

async function onScan(text){
  const code = text.trim();
  const now = Date.now();
  if(busy || (recent[code] && now - recent[code] < 5000)) return;
  busy = true; recent[code] = now;
  show('idle','...جاري التسجيل');
  try{
    const r = await fetch(API + '?id=' + encodeURIComponent(code));
    const d = await r.json();
    show(d.status, d.msg);
    if(d.status === 'ok'){ okCount++; sub.textContent = 'تسجيل اليوم: ' + okCount; }
    addLog(d.status, d.msg);
    beep(d.status);
  }catch(e){
    show('error','❌ مشكلة في الاتصال');
    beep('unknown');
  }
  setTimeout(()=>{ busy = false; }, 1200);
}

const scanner = new Html5Qrcode('reader');
scanner.start(
  { facingMode: 'environment' },
  { fps: 10, qrbox: { width: 240, height: 240 } },
  onScan
).catch(err=>{
  show('error','❌ مفيش صلاحية للكاميرا');
  sub.textContent = 'اسمح للكاميرا من إعدادات المتصفح وافتح الصفحة تاني';
});
</script>
</body>
</html>
